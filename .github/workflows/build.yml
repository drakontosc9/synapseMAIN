name: Build Windows app

# Build the Windows exe automatically:
#  - manually, from the Actions tab (workflow_dispatch)
#  - and attach it to a GitHub Release whenever you push a tag like v0.3.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the Release and upload the zip

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run UI smoke test (real renderer in Electron)
        run: npm run test:ui

      - name: Run live IPC test (real main process, throwaway vault)
        run: npm run test:ipc

      - name: Build Windows installer (NSIS) + portable zip
        run: npm run dist:win

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-Windows
          path: |
            dist/*.exe
            dist/latest.yml

      - name: Attach installer to Release (on version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
